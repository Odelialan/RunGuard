name: CI

on:
  workflow_dispatch:
    inputs:
      run_external_model_evaluation:
        description: Run the paid external-model evaluation after live fault recovery
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Python dependencies
        run: uv sync --all-extras
      - name: Python checks
        run: |
          uv run ruff check apps/api tests services
          uv run python -m compileall -q apps/api
          uv run pytest -q
      - name: Install web dependencies
        run: npm --prefix apps/web ci
      - name: Typecheck and build web
        run: |
          npm --prefix apps/web run lint
          npm --prefix apps/web run build
      - name: API smoke test
        run: |
          uv run python - <<'PY'
          from fastapi.testclient import TestClient
          from runguard_api.main import app

          client = TestClient(app)
          assert client.get("/api/health").status_code == 200
          assert client.get("/api/ready").status_code == 200
          assert client.get("/api/overview").status_code == 200
          assert client.get("/api/incidents").status_code == 200
          print("API smoke test passed")
          PY

  container-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v4.2.0
      - name: Validate Compose and Helm
        run: |
          docker compose config --quiet
          helm lint deploy/helm/runguard \
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set-string runnerImage.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set-string reviewerImage.digest=sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
            --set reviewer.enabled=true \
            --set-string secrets.databaseUrl=postgresql://user:pass@postgres:5432/runguard \
            --set-string secrets.openaiApiKey=ci-validation-only \
            --set-string secrets.a2aReviewerToken=ci-reviewer-secret \
            --set-string secrets.diagnosticsToken=ci-diagnostics-secret \
            --set-string secrets.prometheusWebhookSecret=ci-webhook-secret \
            --set-string secrets.langgraphAesKey=ci-key-16-bytes! \
            --set-string auth.oidcIssuer=https://idp.example.com \
            --set-string auth.oidcAudience=runguard \
            --set-string auth.oidcJwksUrl=https://idp.example.com/.well-known/jwks.json \
            --set-string config.targetInventory.order-api.environment=production \
            --set-string config.targetInventory.order-api.namespace=runguard-system \
            --set-string config.targetInventory.order-api.name=order-api \
            --set-string config.targetInventory.order-api.canary_name=order-api-canary \
            --set-string config.targetInventory.order-api.http_route_name=order-api \
            --set-string config.targetInventory.order-api.stable_service=order-api \
            --set-string config.targetInventory.order-api.canary_service=order-api-canary \
            --set-string config.executionStrategy=canary
          helm template runguard deploy/helm/runguard \
            --namespace runguard-system \
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set-string runnerImage.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set-string reviewerImage.digest=sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
            --set reviewer.enabled=true \
            --set-string secrets.databaseUrl=postgresql://user:pass@postgres:5432/runguard \
            --set-string secrets.openaiApiKey=ci-validation-only \
            --set-string secrets.a2aReviewerToken=ci-reviewer-secret \
            --set-string secrets.diagnosticsToken=ci-diagnostics-secret \
            --set-string secrets.prometheusWebhookSecret=ci-webhook-secret \
            --set-string secrets.langgraphAesKey=ci-key-16-bytes! \
            --set-string auth.oidcIssuer=https://idp.example.com \
            --set-string auth.oidcAudience=runguard \
            --set-string auth.oidcJwksUrl=https://idp.example.com/.well-known/jwks.json \
            --set-string config.targetInventory.order-api.environment=production \
            --set-string config.targetInventory.order-api.namespace=runguard-system \
            --set-string config.targetInventory.order-api.name=order-api \
            --set-string config.targetInventory.order-api.canary_name=order-api-canary \
            --set-string config.targetInventory.order-api.http_route_name=order-api \
            --set-string config.targetInventory.order-api.stable_service=order-api \
            --set-string config.targetInventory.order-api.canary_service=order-api-canary \
            --set-string config.executionStrategy=canary \
            >/tmp/runguard-helm.yaml
          grep -q 'RUNGUARD_MAX_REQUEST_BODY_BYTES: "1048576"' /tmp/runguard-helm.yaml
          grep -q 'RUNGUARD_A2A_REVIEWER_URL: "http://runguard-runguard-reviewer.runguard-system.svc/a2a/reviewer"' /tmp/runguard-helm.yaml
          grep -q 'ghcr.io/odelialan/runguard-reviewer@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc' /tmp/runguard-helm.yaml
          grep -A12 'resources:.*httproutes' /tmp/runguard-helm.yaml \
            | grep -q -- '- "order-api"'
      - name: Test Rego with OPA
        run: |
          docker run --rm \
            -v "$PWD/policies:/policies:ro" \
            openpolicyagent/opa:1.18.2-static@sha256:57f7d06808fff6de3ea1d698e6430990973ca1370be0e54975f0083d615521da \
            test /policies -v
      - name: Build production images
        run: |
          docker build -f deploy/docker/api.Dockerfile -t runguard-api:ci .
          docker build -f deploy/docker/runner.Dockerfile -t runguard-runner:ci .
          docker build -f deploy/docker/reviewer.Dockerfile -t runguard-reviewer:ci .
          docker build -f deploy/docker/web.Dockerfile -t runguard-web:ci .
          docker build -f deploy/docker/fault-injector.Dockerfile -t runguard-fault-injector:ci .
      - name: Start PostgreSQL, Redis and OPA
        run: |
          docker network create runguard-ci
          docker run -d --name postgres --network runguard-ci \
            -e POSTGRES_DB=runguard \
            -e POSTGRES_USER=runguard \
            -e POSTGRES_PASSWORD=runguard-ci \
            pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
          docker run -d --name redis --network runguard-ci \
            redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
          docker run -d --name opa --network runguard-ci \
            -v "$PWD/policies:/policies:ro" \
            openpolicyagent/opa:1.18.2-static@sha256:57f7d06808fff6de3ea1d698e6430990973ca1370be0e54975f0083d615521da \
            run --server --addr=0.0.0.0:8181 /policies/runguard.rego
          docker run -d --name reviewer --network runguard-ci -p 8001:8001 \
            -e RUNGUARD_A2A_REVIEWER_TOKEN=ci-reviewer-secret \
            runguard-reviewer:ci
          for attempt in $(seq 1 30); do
            docker exec postgres pg_isready -U runguard -d runguard && break
            sleep 2
          done
          docker exec redis redis-cli ping
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8001/health && break
            sleep 1
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:8001/a2a/reviewer \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":"unauthorized","method":"message/send","params":{"message":{"messageId":"m0","role":"user","parts":[]}}}')" = 401
          curl -fsS -X POST http://127.0.0.1:8001/a2a/reviewer \
            -H 'Authorization: Bearer ci-reviewer-secret' \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":"ci-review","method":"message/send","params":{"message":{"messageId":"m1","role":"user","parts":[{"kind":"data","data":{"incident":{"environment":"production"},"investigation":{"evidence_ids":["EV-1"]},"evidence":[{"id":"EV-1"}],"remediation":{"tool_name":"kubernetes.patch_deployment","arguments":{"memory_limit":"1Gi"},"rollback":{"memory_limit":"256Mi"}}}}]}}}' \
            >/tmp/reviewer.json
          python - <<'PY'
          import json
          review = json.load(open("/tmp/reviewer.json"))
          decision = review["result"]["artifacts"][0]["parts"][0]["data"]["decision"]
          assert decision == "require_human_approval"
          PY
      - name: Run production dependency integration
        run: |
          docker run -d --name runguard --network runguard-ci -p 8000:8000 \
            -e RUNGUARD_DATABASE_URL=postgresql://runguard:runguard-ci@postgres:5432/runguard \
            -e RUNGUARD_DATABASE_SEED=true \
            -e RUNGUARD_REDIS_URL=redis://redis:6379/0 \
            -e RUNGUARD_POLICY_BACKEND=opa \
            -e RUNGUARD_OPA_URL=http://opa:8181 \
            -e RUNGUARD_ENFORCE_PRODUCTION_GUARDS=true \
            -e RUNGUARD_CONNECTOR_MODE=production \
            -e RUNGUARD_PROMETHEUS_URL=http://prometheus.invalid:9090 \
            -e RUNGUARD_LOKI_URL=http://loki.invalid:3100 \
            -e RUNGUARD_GITHUB_REPOSITORY=Odelialan/RunGuard \
            -e RUNGUARD_GITHUB_TOKEN=ci-validation-only \
            -e RUNGUARD_AGENT_BACKEND=langgraph \
            -e RUNGUARD_EXECUTION_MODE=kubernetes_job \
            -e RUNGUARD_PROMETHEUS_WEBHOOK_SECRET=ci-webhook-secret \
            -e RUNGUARD_OTEL_EXPORTER_OTLP_ENDPOINT=http://otel.invalid:4318 \
            -e RUNGUARD_LANGGRAPH_CHECKPOINT_BACKEND=postgres \
            -e 'LANGGRAPH_AES_KEY=ci-key-16-bytes!' \
            -e RUNGUARD_AUTO_RECOVER=true \
            -e RUNGUARD_A2A_REVIEWER_URL=https://reviewer.example.com/a2a/reviewer \
            -e RUNGUARD_A2A_REVIEWER_TOKEN=ci-reviewer-secret \
            -e RUNGUARD_PROTECT_DIAGNOSTICS=true \
            -e RUNGUARD_DIAGNOSTICS_TOKEN=ci-diagnostics-secret \
            -e OPENAI_API_KEY=ci-validation-only \
            -e RUNGUARD_AUTH_MODE=api_key \
            -e 'RUNGUARD_API_KEYS_JSON={"ci-token":{"subject":"ci","roles":["admin"]}}' \
            -e RUNGUARD_KUBERNETES_ALLOWED_NAMESPACES=runguard-system \
            -e RUNGUARD_KUBERNETES_RUNNER_IMAGE=ghcr.io/odelialan/runguard-runner@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            -e 'RUNGUARD_TARGET_INVENTORY_JSON={"order-api":{"environment":"production","namespace":"runguard-system","name":"order-api"}}' \
            -e RUNGUARD_CORS_ORIGINS=https://runguard.example.com \
            -e RUNGUARD_CORS_ORIGIN_REGEX= \
            -e RUNGUARD_PUBLIC_BASE_URL=https://runguard.example.com \
            -e RUNGUARD_EGRESS_PROXY_URL=http://egress-gateway.invalid:8443 \
            runguard-api:ci
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/ready \
              -H 'X-RunGuard-Diagnostics-Token: ci-diagnostics-secret' \
              >/tmp/ready.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/ready.json
          curl -fsS http://127.0.0.1:8000/ >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:8000/api/incidents \
            -H 'Content-Type: application/json' \
            -d '{"title":"Unauthorized","service":"order-api"}')" = 401
          curl -fsS -X POST http://127.0.0.1:8000/api/incidents \
            -H 'Authorization: Bearer ci-token' \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI production integration","severity":"P2","service":"order-api","environment":"production","description":"PostgreSQL and Redis validation."}' \
            >/tmp/incident.json
          curl -fsS http://127.0.0.1:8000/api/events/stream \
            -H 'Authorization: Bearer ci-token' >/tmp/events.json
          curl -fsS -X POST http://127.0.0.1:8000/api/policies/simulate \
            -H 'Authorization: Bearer ci-token' \
            -H 'Content-Type: application/json' \
            -d '{"environment":"production","tool":"kubernetes.patch_deployment","resource":"order-api","risk_level":"R2","has_rollback":true,"incident_severity":"P1"}' \
            >/tmp/policy.json
          python - <<'PY'
          import json
          ready = json.load(open("/tmp/ready.json"))
          events = json.load(open("/tmp/events.json"))
          policy = json.load(open("/tmp/policy.json"))
          assert ready["components"]["database"] == "ready"
          assert ready["components"]["redis"] == "ready"
          assert ready["components"]["policy"] == "ready"
          assert ready["components"]["authentication"] == "ready"
          assert events and events[0]["event_type"] == "incident.created"
          assert policy["decision"] == "require_approval"
          assert policy["backend"] == "opa"
          print("Container integration passed")
          PY
          docker exec postgres psql -U runguard -d runguard -Atc \
            "SELECT count(*) FROM schema_migrations" | grep -qx 6
          docker exec postgres psql -U runguard -d runguard -Atc \
            "SELECT to_regclass('public.workflow_checkpoints')" \
            | grep -qx workflow_checkpoints
          EVENT_ID="$(docker exec postgres psql -U runguard -d runguard -Atc \
            "SELECT id FROM incident_events ORDER BY created_at LIMIT 1")"
          test -n "$EVENT_ID"
          if docker exec postgres psql -v ON_ERROR_STOP=1 -U runguard -d runguard \
            -c "UPDATE incident_events SET actor='tampered' WHERE id='$EVENT_ID'"; then
            echo "append-only UPDATE unexpectedly succeeded" >&2
            exit 1
          fi
          if docker exec postgres psql -v ON_ERROR_STOP=1 -U runguard -d runguard \
            -c "DELETE FROM incident_events WHERE id='$EVENT_ID'"; then
            echo "append-only DELETE unexpectedly succeeded" >&2
            exit 1
          fi
      - name: Print container logs on failure
        if: failure()
        run: |
          docker logs runguard || true
          docker logs postgres || true
          docker logs redis || true
          docker logs opa || true

  live-kubernetes-12:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc
        with:
          version: v0.32.0
          cluster_name: runguard-eval
          wait: 120s
      - name: Inject and observe twelve Kubernetes failures
        run: python3 scripts/kind-live-evaluation.py
      - name: Preserve immutable experiment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-kubernetes-12-${{ github.run_id }}
          path: artifacts/live-kubernetes-12.json
          if-no-files-found: error

  external-model-evaluation:
    if: github.event_name == 'workflow_dispatch' && inputs.run_external_model_evaluation
    needs: [live-kubernetes-12]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: live-kubernetes-12-*
          path: live-evidence
          merge-multiple: true
      - name: Run paid external model evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.RUNGUARD_EVAL_OPENAI_API_KEY }}
          RUNGUARD_LLM_MODEL: gpt-5-mini
        run: |
          test -n "$OPENAI_API_KEY"
          uv sync --extra production
          uv run python scripts/external-model-evaluation.py \
            live-evidence/live-kubernetes-12.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: external-model-live-kubernetes-12-${{ github.run_id }}
          path: artifacts/external-model-live-kubernetes-12.json
          if-no-files-found: error

  signed-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, container-integration, live-kubernetes-12]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runguard
            dockerfile: deploy/docker/api.Dockerfile
          - name: runguard-runner
            dockerfile: deploy/docker/runner.Dockerfile
          - name: runguard-reviewer
            dockerfile: deploy/docker/reviewer.Dockerfile
          - name: runguard-web
            dockerfile: deploy/docker/web.Dockerfile
          - name: runguard-fault-injector
            dockerfile: deploy/docker/fault-injector.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/odelialan/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Keyless sign and verify immutable image
        env:
          IMAGE: ghcr.io/odelialan/${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp='^https://github.com/Odelialan/RunGuard/.github/workflows/ci.yml@refs/tags/v[0-9].*$'
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ghcr.io/odelialan/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ matrix.name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ghcr.io/odelialan/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-name: ghcr.io/odelialan/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ matrix.name }}.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.name }}-sbom
          path: ${{ matrix.name }}.spdx.json
          if-no-files-found: error
