name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.3"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Python dependencies
        run: uv sync --all-extras
      - name: Python checks
        run: |
          uv run ruff check apps/api tests services
          uv run python -m compileall -q apps/api
          uv run pytest -q
      - name: Install web dependencies
        run: npm --prefix apps/web ci
      - name: Typecheck and build web
        run: |
          npm --prefix apps/web run lint
          npm --prefix apps/web run build
      - name: API smoke test
        run: |
          uv run python - <<'PY'
          from fastapi.testclient import TestClient
          from runguard_api.main import app

          client = TestClient(app)
          assert client.get("/api/health").status_code == 200
          assert client.get("/api/ready").status_code == 200
          assert client.get("/api/overview").status_code == 200
          assert client.get("/api/incidents").status_code == 200
          print("API smoke test passed")
          PY

  container-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3
      - name: Validate Compose and Helm
        run: |
          docker compose config --quiet
          helm lint deploy/helm/runguard \
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set-string runnerImage.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set-string secrets.databaseUrl=postgresql://user:pass@postgres:5432/runguard \
            --set-string secrets.openaiApiKey=ci-validation-only \
            --set-string secrets.prometheusWebhookSecret=ci-webhook-secret \
            --set-string secrets.langgraphAesKey=ci-key-16-bytes! \
            --set-string auth.oidcIssuer=https://idp.example.com \
            --set-string auth.oidcAudience=runguard \
            --set-string auth.oidcJwksUrl=https://idp.example.com/.well-known/jwks.json \
            --set-string config.targetInventory.order-api.environment=production \
            --set-string config.targetInventory.order-api.namespace=runguard-system \
            --set-string config.targetInventory.order-api.name=order-api
          helm template runguard deploy/helm/runguard \
            --namespace runguard-system \
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set-string runnerImage.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set-string secrets.databaseUrl=postgresql://user:pass@postgres:5432/runguard \
            --set-string secrets.openaiApiKey=ci-validation-only \
            --set-string secrets.prometheusWebhookSecret=ci-webhook-secret \
            --set-string secrets.langgraphAesKey=ci-key-16-bytes! \
            --set-string auth.oidcIssuer=https://idp.example.com \
            --set-string auth.oidcAudience=runguard \
            --set-string auth.oidcJwksUrl=https://idp.example.com/.well-known/jwks.json \
            --set-string config.targetInventory.order-api.environment=production \
            --set-string config.targetInventory.order-api.namespace=runguard-system \
            --set-string config.targetInventory.order-api.name=order-api \
            >/tmp/runguard-helm.yaml
          grep -q 'RUNGUARD_MAX_REQUEST_BODY_BYTES: "1048576"' /tmp/runguard-helm.yaml
      - name: Test Rego with OPA
        run: |
          docker run --rm \
            -v "$PWD/policies:/policies:ro" \
            openpolicyagent/opa:1.18.2-static \
            test /policies -v
      - name: Build production images
        run: |
          docker build -f deploy/docker/api.Dockerfile -t runguard-api:ci .
          docker build -f deploy/docker/runner.Dockerfile -t runguard-runner:ci .
          docker build -f deploy/docker/web.Dockerfile -t runguard-web:ci .
          docker build -f deploy/docker/fault-injector.Dockerfile -t runguard-fault-injector:ci .
      - name: Start PostgreSQL, Redis and OPA
        run: |
          docker network create runguard-ci
          docker run -d --name postgres --network runguard-ci \
            -e POSTGRES_DB=runguard \
            -e POSTGRES_USER=runguard \
            -e POSTGRES_PASSWORD=runguard-ci \
            pgvector/pgvector:pg16
          docker run -d --name redis --network runguard-ci redis:7.4-alpine
          docker run -d --name opa --network runguard-ci \
            -v "$PWD/policies:/policies:ro" \
            openpolicyagent/opa:1.18.2-static \
            run --server --addr=0.0.0.0:8181 /policies/runguard.rego
          for attempt in $(seq 1 30); do
            docker exec postgres pg_isready -U runguard -d runguard && break
            sleep 2
          done
          docker exec redis redis-cli ping
      - name: Run production dependency integration
        run: |
          docker run -d --name runguard --network runguard-ci -p 8000:8000 \
            -e RUNGUARD_DATABASE_URL=postgresql://runguard:runguard-ci@postgres:5432/runguard \
            -e RUNGUARD_DATABASE_SEED=true \
            -e RUNGUARD_REDIS_URL=redis://redis:6379/0 \
            -e RUNGUARD_POLICY_BACKEND=opa \
            -e RUNGUARD_OPA_URL=http://opa:8181 \
            -e RUNGUARD_ENFORCE_PRODUCTION_GUARDS=true \
            -e RUNGUARD_CONNECTOR_MODE=production \
            -e RUNGUARD_PROMETHEUS_URL=http://prometheus.invalid:9090 \
            -e RUNGUARD_LOKI_URL=http://loki.invalid:3100 \
            -e RUNGUARD_GITHUB_REPOSITORY=Odelialan/RunGuard \
            -e RUNGUARD_GITHUB_TOKEN=ci-validation-only \
            -e RUNGUARD_AGENT_BACKEND=langgraph \
            -e RUNGUARD_EXECUTION_MODE=kubernetes_job \
            -e RUNGUARD_PROMETHEUS_WEBHOOK_SECRET=ci-webhook-secret \
            -e RUNGUARD_OTEL_EXPORTER_OTLP_ENDPOINT=http://otel.invalid:4318 \
            -e RUNGUARD_LANGGRAPH_CHECKPOINT_BACKEND=postgres \
            -e 'LANGGRAPH_AES_KEY=ci-key-16-bytes!' \
            -e RUNGUARD_AUTO_RECOVER=true \
            -e OPENAI_API_KEY=ci-validation-only \
            -e RUNGUARD_AUTH_MODE=api_key \
            -e 'RUNGUARD_API_KEYS_JSON={"ci-token":{"subject":"ci","roles":["admin"]}}' \
            -e RUNGUARD_KUBERNETES_ALLOWED_NAMESPACES=runguard-system \
            -e RUNGUARD_KUBERNETES_RUNNER_IMAGE=ghcr.io/odelialan/runguard-runner@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            -e 'RUNGUARD_TARGET_INVENTORY_JSON={"order-api":{"environment":"production","namespace":"runguard-system","name":"order-api"}}' \
            -e RUNGUARD_CORS_ORIGINS=https://runguard.example.com \
            -e RUNGUARD_CORS_ORIGIN_REGEX= \
            -e RUNGUARD_PUBLIC_BASE_URL=https://runguard.example.com \
            runguard-api:ci
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/ready >/tmp/ready.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/ready.json
          curl -fsS http://127.0.0.1:8000/ >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:8000/api/incidents \
            -H 'Content-Type: application/json' \
            -d '{"title":"Unauthorized","service":"order-api"}')" = 401
          curl -fsS -X POST http://127.0.0.1:8000/api/incidents \
            -H 'Authorization: Bearer ci-token' \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI production integration","severity":"P2","service":"order-api","environment":"production","description":"PostgreSQL and Redis validation."}' \
            >/tmp/incident.json
          curl -fsS http://127.0.0.1:8000/api/events/stream \
            -H 'Authorization: Bearer ci-token' >/tmp/events.json
          curl -fsS -X POST http://127.0.0.1:8000/api/policies/simulate \
            -H 'Authorization: Bearer ci-token' \
            -H 'Content-Type: application/json' \
            -d '{"environment":"production","tool":"kubernetes.patch_deployment","resource":"order-api","risk_level":"R2","has_rollback":true,"incident_severity":"P1"}' \
            >/tmp/policy.json
          python - <<'PY'
          import json
          ready = json.load(open("/tmp/ready.json"))
          events = json.load(open("/tmp/events.json"))
          policy = json.load(open("/tmp/policy.json"))
          assert ready["components"]["database"] == "ready"
          assert ready["components"]["redis"] == "ready"
          assert ready["components"]["policy"] == "ready"
          assert ready["components"]["authentication"] == "ready"
          assert events and events[0]["event_type"] == "incident.created"
          assert policy["decision"] == "require_approval"
          assert policy["backend"] == "opa"
          print("Container integration passed")
          PY
          docker exec postgres psql -U runguard -d runguard -Atc \
            "SELECT count(*) FROM schema_migrations" | grep -qx 4
          docker exec postgres psql -U runguard -d runguard -Atc \
            "SELECT to_regclass('public.workflow_checkpoints')" \
            | grep -qx workflow_checkpoints
      - name: Print container logs on failure
        if: failure()
        run: |
          docker logs runguard || true
          docker logs postgres || true
          docker logs redis || true
          docker logs opa || true
