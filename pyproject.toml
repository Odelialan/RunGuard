[project]
name = "runguard"
version = "1.2.0"
description = "Agentic SRE incident response and trusted execution platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OdeliaLan" }]
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "httpx[socks]>=0.28.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "PyJWT>=2.10.0,<3.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
production = [
  "cryptography>=46.0.0,<50.0.0",
  "kubernetes>=32.0.0,<36.0.0",
  "langchain-openai>=1.0.0,<2.0.0",
  "langgraph>=1.0.0,<2.0.0",
  "langgraph-checkpoint-postgres>=3.0.0,<4.0.0",
  "mcp>=1.20.0,<2.0.0",
  "opentelemetry-api>=1.36.0,<2.0.0",
  "opentelemetry-exporter-otlp-proto-http>=1.36.0,<2.0.0",
  "opentelemetry-sdk>=1.36.0,<2.0.0",
  "pgvector>=0.4.0,<1.0.0",
  "psycopg[binary,pool]>=3.2.0,<4.0.0",
  "pycryptodome>=3.23.0,<4.0.0",
  "redis>=6.0.0,<8.0.0",
]
dev = [
  "pytest>=8.4.0,<9.0.0",
  "pytest-asyncio>=1.2.0,<2.0.0",
  "ruff>=0.12.0,<1.0.0",
]

[project.scripts]
runguard-api = "runguard_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/runguard_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
