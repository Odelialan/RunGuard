[project]
name = "runguard"
version = "1.0.0"
description = "Agentic SRE incident response and trusted execution platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OdeliaLan", email = "lanhanyue1994@163.com" }
]
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0,<1.0.0",
  "pytest>=8.4.0,<9.0.0",
  "ruff>=0.12.0,<1.0.0",
]

[project.scripts]
runguard-api = "runguard_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/runguard_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
