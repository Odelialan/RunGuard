services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    environment:
      POSTGRES_DB: runguard
      POSTGRES_USER: runguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-runguard-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runguard -d runguard"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  opa:
    image: openpolicyagent/opa:1.18.2-static@sha256:57f7d06808fff6de3ea1d698e6430990973ca1370be0e54975f0083d615521da
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --set=decision_logs.console=true
      - /policies/runguard.rego
    volumes:
      - ./policies:/policies:ro
    healthcheck:
      test: ["CMD", "/opa", "eval", "1+1"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.5.3@sha256:3165cecce301ce5b9b6e3530284b080934a05cd5cafac3d3d82edcb887b45ecd
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./deploy/observability/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.8.2@sha256:0ef775495967cd5d7a6b2e146b6ea695d624803c8db8349fb8ce4164f719f9b7
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./deploy/observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0@sha256:e0f565815b2b8e78eb9fdbb80f6190c921ab323aaa8ccceab3255c6d4225f4af
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./deploy/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    depends_on:
      - tempo
    ports:
      - "4317:4317"
      - "4318:4318"

  grafana:
    image: grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-runguard-local-only}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/runguard.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    ports:
      - "3000:3000"

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      RUNGUARD_ENVIRONMENT: development
      RUNGUARD_ENFORCE_PRODUCTION_GUARDS: ${RUNGUARD_ENFORCE_PRODUCTION_GUARDS:-false}
      RUNGUARD_DATABASE_URL: postgresql://runguard:${POSTGRES_PASSWORD:-runguard-local-only}@postgres:5432/runguard
      RUNGUARD_DATABASE_SEED: ${RUNGUARD_DATABASE_SEED:-true}
      RUNGUARD_DATABASE_POOL_MIN_SIZE: ${RUNGUARD_DATABASE_POOL_MIN_SIZE:-2}
      RUNGUARD_DATABASE_POOL_MAX_SIZE: ${RUNGUARD_DATABASE_POOL_MAX_SIZE:-20}
      RUNGUARD_REDIS_URL: redis://redis:6379/0
      RUNGUARD_PUBLIC_BASE_URL: ${RUNGUARD_PUBLIC_BASE_URL:-}
      RUNGUARD_MAX_REQUEST_BODY_BYTES: ${RUNGUARD_MAX_REQUEST_BODY_BYTES:-1048576}
      RUNGUARD_PROTECT_DIAGNOSTICS: ${RUNGUARD_PROTECT_DIAGNOSTICS:-false}
      RUNGUARD_DIAGNOSTICS_TOKEN: ${RUNGUARD_DIAGNOSTICS_TOKEN:-local-diagnostics-token}
      RUNGUARD_POLICY_BACKEND: opa
      RUNGUARD_OPA_URL: http://opa:8181
      RUNGUARD_OPA_FAIL_CLOSED: "true"
      RUNGUARD_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      RUNGUARD_CONNECTOR_MODE: ${RUNGUARD_CONNECTOR_MODE:-mock}
      RUNGUARD_MCP_PROMETHEUS_URL: ${RUNGUARD_MCP_PROMETHEUS_URL:-}
      RUNGUARD_MCP_PROMETHEUS_TOKEN: ${RUNGUARD_MCP_PROMETHEUS_TOKEN:-}
      RUNGUARD_MCP_LOKI_URL: ${RUNGUARD_MCP_LOKI_URL:-}
      RUNGUARD_MCP_LOKI_TOKEN: ${RUNGUARD_MCP_LOKI_TOKEN:-}
      RUNGUARD_MCP_KUBERNETES_URL: ${RUNGUARD_MCP_KUBERNETES_URL:-}
      RUNGUARD_MCP_KUBERNETES_TOKEN: ${RUNGUARD_MCP_KUBERNETES_TOKEN:-}
      RUNGUARD_MCP_GITHUB_URL: ${RUNGUARD_MCP_GITHUB_URL:-}
      RUNGUARD_MCP_GITHUB_TOKEN: ${RUNGUARD_MCP_GITHUB_TOKEN:-}
      RUNGUARD_AGENT_BACKEND: ${RUNGUARD_AGENT_BACKEND:-deterministic}
      RUNGUARD_EXECUTION_MODE: ${RUNGUARD_EXECUTION_MODE:-simulation}
      RUNGUARD_EXECUTION_STRATEGY: ${RUNGUARD_EXECUTION_STRATEGY:-direct}
      RUNGUARD_A2A_REVIEWER_URL: ${RUNGUARD_A2A_REVIEWER_URL:-http://reviewer:8001/a2a/reviewer}
      RUNGUARD_A2A_REVIEWER_TOKEN: ${RUNGUARD_A2A_REVIEWER_TOKEN:-local-reviewer-token}
      RUNGUARD_PROMETHEUS_URL: http://prometheus:9090
      RUNGUARD_LOKI_URL: http://loki:3100
      RUNGUARD_GITHUB_REPOSITORY: ${RUNGUARD_GITHUB_REPOSITORY:-Odelialan/RunGuard}
      RUNGUARD_GITHUB_TOKEN: ${RUNGUARD_GITHUB_TOKEN:-}
      RUNGUARD_KUBERNETES_ALLOWED_NAMESPACES: ${RUNGUARD_KUBERNETES_ALLOWED_NAMESPACES:-runguard-system}
      RUNGUARD_TARGET_INVENTORY_JSON: ${RUNGUARD_TARGET_INVENTORY_JSON:-{}}
      RUNGUARD_LLM_MODEL: ${RUNGUARD_LLM_MODEL:-gpt-5-mini}
      RUNGUARD_EMBEDDINGS_ENABLED: ${RUNGUARD_EMBEDDINGS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RUNGUARD_AUTH_MODE: ${RUNGUARD_AUTH_MODE:-disabled}
      RUNGUARD_API_KEYS_JSON: ${RUNGUARD_API_KEYS_JSON:-}
      RUNGUARD_OIDC_ISSUER: ${RUNGUARD_OIDC_ISSUER:-}
      RUNGUARD_OIDC_AUDIENCE: ${RUNGUARD_OIDC_AUDIENCE:-}
      RUNGUARD_OIDC_JWKS_URL: ${RUNGUARD_OIDC_JWKS_URL:-}
      RUNGUARD_PROMETHEUS_WEBHOOK_SECRET: ${RUNGUARD_PROMETHEUS_WEBHOOK_SECRET:-}
      RUNGUARD_LANGGRAPH_CHECKPOINT_BACKEND: ${RUNGUARD_LANGGRAPH_CHECKPOINT_BACKEND:-postgres}
      LANGGRAPH_AES_KEY: ${LANGGRAPH_AES_KEY:-}
      RUNGUARD_AUTO_RECOVER: ${RUNGUARD_AUTO_RECOVER:-false}
      RUNGUARD_RECOVERY_CONCURRENCY: ${RUNGUARD_RECOVERY_CONCURRENCY:-4}
      RUNGUARD_INCIDENT_TOOL_CALL_BUDGET: ${RUNGUARD_INCIDENT_TOOL_CALL_BUDGET:-24}
      RUNGUARD_INCIDENT_TIMEOUT_SECONDS: ${RUNGUARD_INCIDENT_TIMEOUT_SECONDS:-900}
      RUNGUARD_INCIDENT_TOKEN_BUDGET_PER_CALL: ${RUNGUARD_INCIDENT_TOKEN_BUDGET_PER_CALL:-4096}
      RUNGUARD_INCIDENT_MEMORY_LIMIT: ${RUNGUARD_INCIDENT_MEMORY_LIMIT:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opa:
        condition: service_healthy
      otel-collector:
        condition: service_started
      reviewer:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/api/ready',headers={'X-RunGuard-Diagnostics-Token':os.getenv('RUNGUARD_DIAGNOSTICS_TOKEN','')}); urllib.request.urlopen(request)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  reviewer:
    build:
      context: .
      dockerfile: deploy/docker/reviewer.Dockerfile
    environment:
      RUNGUARD_A2A_REVIEWER_TOKEN: ${RUNGUARD_A2A_REVIEWER_TOKEN:-local-reviewer-token}
      RUNGUARD_REVIEWER_PUBLIC_BASE_URL: ${RUNGUARD_REVIEWER_PUBLIC_BASE_URL:-http://localhost:8001}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

  fault-injector:
    build:
      context: .
      dockerfile: deploy/docker/fault-injector.Dockerfile
    environment:
      FAULT_INJECTOR_TOKEN: ${FAULT_INJECTOR_TOKEN:-local-demo-token}
    ports:
      - "8090:8090"

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
