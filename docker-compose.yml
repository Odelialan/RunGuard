services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: runguard
      POSTGRES_USER: runguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-runguard-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runguard -d runguard"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  opa:
    image: openpolicyagent/opa:1.18.2-static
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --set=decision_logs.console=true
      - /policies/runguard.rego
    volumes:
      - ./policies:/policies:ro
    healthcheck:
      test: ["CMD", "/opa", "eval", "1+1"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./deploy/observability/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./deploy/observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./deploy/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    depends_on:
      - tempo
    ports:
      - "4317:4317"
      - "4318:4318"

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-runguard-local-only}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/runguard.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    ports:
      - "3000:3000"

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      RUNGUARD_ENVIRONMENT: production
      RUNGUARD_ENFORCE_PRODUCTION_GUARDS: ${RUNGUARD_ENFORCE_PRODUCTION_GUARDS:-false}
      RUNGUARD_DATABASE_URL: postgresql://runguard:${POSTGRES_PASSWORD:-runguard-local-only}@postgres:5432/runguard
      RUNGUARD_DATABASE_SEED: ${RUNGUARD_DATABASE_SEED:-true}
      RUNGUARD_DATABASE_POOL_MIN_SIZE: ${RUNGUARD_DATABASE_POOL_MIN_SIZE:-2}
      RUNGUARD_DATABASE_POOL_MAX_SIZE: ${RUNGUARD_DATABASE_POOL_MAX_SIZE:-20}
      RUNGUARD_REDIS_URL: redis://redis:6379/0
      RUNGUARD_POLICY_BACKEND: opa
      RUNGUARD_OPA_URL: http://opa:8181
      RUNGUARD_OPA_FAIL_CLOSED: "true"
      RUNGUARD_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      RUNGUARD_CONNECTOR_MODE: ${RUNGUARD_CONNECTOR_MODE:-mock}
      RUNGUARD_MCP_PROMETHEUS_URL: ${RUNGUARD_MCP_PROMETHEUS_URL:-}
      RUNGUARD_MCP_PROMETHEUS_TOKEN: ${RUNGUARD_MCP_PROMETHEUS_TOKEN:-}
      RUNGUARD_MCP_LOKI_URL: ${RUNGUARD_MCP_LOKI_URL:-}
      RUNGUARD_MCP_LOKI_TOKEN: ${RUNGUARD_MCP_LOKI_TOKEN:-}
      RUNGUARD_MCP_KUBERNETES_URL: ${RUNGUARD_MCP_KUBERNETES_URL:-}
      RUNGUARD_MCP_KUBERNETES_TOKEN: ${RUNGUARD_MCP_KUBERNETES_TOKEN:-}
      RUNGUARD_MCP_GITHUB_URL: ${RUNGUARD_MCP_GITHUB_URL:-}
      RUNGUARD_MCP_GITHUB_TOKEN: ${RUNGUARD_MCP_GITHUB_TOKEN:-}
      RUNGUARD_AGENT_BACKEND: ${RUNGUARD_AGENT_BACKEND:-deterministic}
      RUNGUARD_EXECUTION_MODE: ${RUNGUARD_EXECUTION_MODE:-simulation}
      RUNGUARD_PROMETHEUS_URL: http://prometheus:9090
      RUNGUARD_LOKI_URL: http://loki:3100
      RUNGUARD_GITHUB_REPOSITORY: ${RUNGUARD_GITHUB_REPOSITORY:-Odelialan/RunGuard}
      RUNGUARD_GITHUB_TOKEN: ${RUNGUARD_GITHUB_TOKEN:-}
      RUNGUARD_KUBERNETES_ALLOWED_NAMESPACES: ${RUNGUARD_KUBERNETES_ALLOWED_NAMESPACES:-runguard-system}
      RUNGUARD_LLM_MODEL: ${RUNGUARD_LLM_MODEL:-gpt-5-mini}
      RUNGUARD_EMBEDDINGS_ENABLED: ${RUNGUARD_EMBEDDINGS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RUNGUARD_AUTH_MODE: ${RUNGUARD_AUTH_MODE:-disabled}
      RUNGUARD_API_KEYS_JSON: ${RUNGUARD_API_KEYS_JSON:-}
      RUNGUARD_OIDC_ISSUER: ${RUNGUARD_OIDC_ISSUER:-}
      RUNGUARD_OIDC_AUDIENCE: ${RUNGUARD_OIDC_AUDIENCE:-}
      RUNGUARD_OIDC_JWKS_URL: ${RUNGUARD_OIDC_JWKS_URL:-}
      RUNGUARD_PROMETHEUS_WEBHOOK_SECRET: ${RUNGUARD_PROMETHEUS_WEBHOOK_SECRET:-}
      RUNGUARD_LANGGRAPH_CHECKPOINT_BACKEND: ${RUNGUARD_LANGGRAPH_CHECKPOINT_BACKEND:-postgres}
      LANGGRAPH_AES_KEY: ${LANGGRAPH_AES_KEY:-}
      RUNGUARD_AUTO_RECOVER: ${RUNGUARD_AUTO_RECOVER:-false}
      RUNGUARD_RECOVERY_CONCURRENCY: ${RUNGUARD_RECOVERY_CONCURRENCY:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opa:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

  fault-injector:
    build:
      context: .
      dockerfile: deploy/docker/fault-injector.Dockerfile
    environment:
      FAULT_INJECTOR_TOKEN: ${FAULT_INJECTOR_TOKEN:-local-demo-token}
    ports:
      - "8090:8090"

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
