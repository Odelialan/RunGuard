replicaCount: 1

image:
  repository: runguard
  tag: kind
  pullPolicy: IfNotPresent

runnerImage:
  repository: runguard
  tag: kind

service:
  type: NodePort
  port: 80

config:
  environment: kind
  enforceProductionGuards: false
  connectorMode: hybrid
  agentBackend: deterministic
  executionMode: kubernetes_job
  policyBackend: opa
  opaUrl: http://opa.runguard-system.svc:8181
  prometheusUrl: ""
  lokiUrl: ""
  githubRepository: Odelialan/RunGuard
  a2aReviewerUrl: ""
  redisUrl: redis://redis.runguard-system.svc:6379/0
  otelEndpoint: ""
  databaseSeed: true
  databasePoolMinSize: 1
  databasePoolMaxSize: 5
  embeddingsEnabled: false
  llmModel: gpt-5-mini
  verificationUrlTemplate: http://fault-sentinel.runguard-system.svc/health
  allowedNamespaces: runguard-system
  targetInventory:
    order-api:
      environment: staging
      namespace: runguard-system
      name: order-api
  checkpointBackend: memory
  autoRecover: false
  recoveryConcurrency: 2
  corsOrigins: http://127.0.0.1:8088
  corsOriginRegex: ""
  publicBaseUrl: http://127.0.0.1:8088
  maxRequestBodyBytes: 1048576

auth:
  mode: disabled
  rateLimitPerMinute: 300

secrets:
  databaseUrl: postgresql://runguard:runguard-kind@postgres.runguard-system.svc:5432/runguard
  openaiApiKey: kind-not-used
  githubToken: ""
  prometheusWebhookSecret: kind-webhook-secret
  langgraphAesKey: kind-demo-key-16

autoscaling:
  enabled: false

networkPolicy:
  enabled: false
