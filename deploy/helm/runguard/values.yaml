replicaCount: 2

image:
  repository: ghcr.io/odelialan/runguard
  tag: "1.4.0"
  digest: ""
  pullPolicy: IfNotPresent

runnerImage:
  repository: ghcr.io/odelialan/runguard-runner
  tag: "1.4.0"
  digest: ""

reviewerImage:
  repository: ghcr.io/odelialan/runguard-reviewer
  tag: "1.4.0"
  digest: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: runguard.example.com
  tlsSecret: ""

config:
  environment: production
  enforceProductionGuards: true
  connectorMode: production
  agentBackend: langgraph
  executionMode: kubernetes_job
  executionStrategy: direct
  canaryTrafficSteps: 5,25,50
  policyBackend: opa
  opaUrl: http://opa.runguard-system.svc:8181
  prometheusUrl: http://prometheus.monitoring.svc:9090
  lokiUrl: http://loki.monitoring.svc:3100
  githubRepository: Odelialan/RunGuard
  mcpPrometheusUrl: ""
  mcpLokiUrl: ""
  mcpKubernetesUrl: ""
  mcpGitHubUrl: ""
  a2aReviewerUrl: ""
  redisUrl: redis://redis.runguard-system.svc:6379/0
  otelEndpoint: http://otel-collector.observability.svc:4318
  databaseSeed: false
  databasePoolMinSize: 2
  databasePoolMaxSize: 20
  embeddingsEnabled: true
  llmModel: gpt-5-mini
  verificationUrlTemplate: ""
  allowedNamespaces: ""
  targetInventory: {}
  checkpointBackend: postgres
  autoRecover: true
  recoveryConcurrency: 4
  incidentToolCallBudget: 24
  incidentTimeoutSeconds: 900
  incidentTokenBudgetPerCall: 4096
  incidentTokenBudgetTotal: 100000
  incidentMemoryLimit: 5
  corsOrigins: https://runguard.example.com
  corsOriginRegex: ""
  publicBaseUrl: https://runguard.example.com
  egressProxyUrl: http://egress-gateway.egress-system.svc:8443
  maxRequestBodyBytes: 1048576
  protectDiagnostics: true

auth:
  mode: oidc
  oidcIssuer: ""
  oidcAudience: ""
  oidcJwksUrl: ""
  oidcAlgorithms: RS256
  oidcRolesClaim: roles
  rateLimitPerMinute: 120
  preauthRateLimitPerMinute: 30

secrets:
  existingSecret: ""
  databaseUrl: ""
  openaiApiKey: ""
  prometheusToken: ""
  lokiToken: ""
  githubToken: ""
  mcpPrometheusToken: ""
  mcpLokiToken: ""
  mcpKubernetesToken: ""
  mcpGitHubToken: ""
  a2aReviewerToken: ""
  diagnosticsToken: ""
  apiKeysJson: ""
  prometheusWebhookSecret: ""
  langgraphAesKey: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  ingressNamespaces:
    - ingress-nginx
    - monitoring
  dependencyNamespaces:
    - monitoring
    - observability
  externalHttps:
    mode: egressGateway
    gatewayNamespace: egress-system
    gatewayPodLabels:
      app.kubernetes.io/name: egress-gateway
    gatewayPort: 8443
  kubernetesApiCidrs:
    - 10.96.0.1/32

serviceMonitor:
  enabled: false
  interval: 30s

reviewer:
  enabled: false
  publicBaseUrl: ""
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

serviceAccount:
  create: true
  name: runguard-api

executorServiceAccount:
  create: true
  name: runguard-executor
