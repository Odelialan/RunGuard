{{- $reviewerURL := .Values.config.a2aReviewerUrl -}}
{{- if and .Values.reviewer.enabled (not $reviewerURL) -}}
{{- $reviewerURL = printf "http://%s-reviewer.%s.svc/a2a/reviewer" (include "runguard.fullname" .) .Release.Namespace -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "runguard.fullname" . }}
  labels:
    {{- include "runguard.labels" . | nindent 4 }}
data:
  RUNGUARD_ENVIRONMENT: {{ .Values.config.environment | quote }}
  RUNGUARD_ENFORCE_PRODUCTION_GUARDS: {{ .Values.config.enforceProductionGuards | quote }}
  RUNGUARD_CONNECTOR_MODE: {{ .Values.config.connectorMode | quote }}
  RUNGUARD_AGENT_BACKEND: {{ .Values.config.agentBackend | quote }}
  RUNGUARD_EXECUTION_MODE: {{ .Values.config.executionMode | quote }}
  RUNGUARD_EXECUTION_STRATEGY: {{ .Values.config.executionStrategy | quote }}
  RUNGUARD_CANARY_TRAFFIC_STEPS: {{ .Values.config.canaryTrafficSteps | quote }}
  RUNGUARD_POLICY_BACKEND: {{ .Values.config.policyBackend | quote }}
  RUNGUARD_OPA_URL: {{ .Values.config.opaUrl | quote }}
  RUNGUARD_OPA_FAIL_CLOSED: "true"
  RUNGUARD_PROMETHEUS_URL: {{ .Values.config.prometheusUrl | quote }}
  RUNGUARD_LOKI_URL: {{ .Values.config.lokiUrl | quote }}
  RUNGUARD_GITHUB_REPOSITORY: {{ .Values.config.githubRepository | quote }}
  RUNGUARD_MCP_PROMETHEUS_URL: {{ .Values.config.mcpPrometheusUrl | quote }}
  RUNGUARD_MCP_LOKI_URL: {{ .Values.config.mcpLokiUrl | quote }}
  RUNGUARD_MCP_KUBERNETES_URL: {{ .Values.config.mcpKubernetesUrl | quote }}
  RUNGUARD_MCP_GITHUB_URL: {{ .Values.config.mcpGitHubUrl | quote }}
  RUNGUARD_A2A_REVIEWER_URL: {{ if .Values.config.enforceProductionGuards }}{{ required "config.a2aReviewerUrl or reviewer.enabled is required in production" $reviewerURL | quote }}{{ else }}{{ $reviewerURL | quote }}{{ end }}
  RUNGUARD_REDIS_URL: {{ .Values.config.redisUrl | quote }}
  RUNGUARD_OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelEndpoint | quote }}
  RUNGUARD_DATABASE_SEED: {{ .Values.config.databaseSeed | quote }}
  RUNGUARD_DATABASE_POOL_MIN_SIZE: {{ .Values.config.databasePoolMinSize | quote }}
  RUNGUARD_DATABASE_POOL_MAX_SIZE: {{ .Values.config.databasePoolMaxSize | quote }}
  RUNGUARD_MIGRATIONS_DIR: "/app/deploy/postgres"
  RUNGUARD_EMBEDDINGS_ENABLED: {{ .Values.config.embeddingsEnabled | quote }}
  RUNGUARD_LLM_MODEL: {{ .Values.config.llmModel | quote }}
  RUNGUARD_VERIFICATION_URL_TEMPLATE: {{ .Values.config.verificationUrlTemplate | quote }}
  RUNGUARD_LANGGRAPH_CHECKPOINT_BACKEND: {{ .Values.config.checkpointBackend | quote }}
  RUNGUARD_AUTO_RECOVER: {{ .Values.config.autoRecover | quote }}
  RUNGUARD_RECOVERY_CONCURRENCY: {{ .Values.config.recoveryConcurrency | quote }}
  RUNGUARD_INCIDENT_TOOL_CALL_BUDGET: {{ .Values.config.incidentToolCallBudget | quote }}
  RUNGUARD_INCIDENT_TIMEOUT_SECONDS: {{ .Values.config.incidentTimeoutSeconds | quote }}
  RUNGUARD_INCIDENT_TOKEN_BUDGET_PER_CALL: {{ .Values.config.incidentTokenBudgetPerCall | quote }}
  RUNGUARD_INCIDENT_TOKEN_BUDGET_TOTAL: {{ .Values.config.incidentTokenBudgetTotal | quote }}
  RUNGUARD_INCIDENT_MEMORY_LIMIT: {{ .Values.config.incidentMemoryLimit | quote }}
  RUNGUARD_CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  RUNGUARD_CORS_ORIGIN_REGEX: {{ .Values.config.corsOriginRegex | quote }}
  RUNGUARD_PUBLIC_BASE_URL: {{ if .Values.config.enforceProductionGuards }}{{ required "config.publicBaseUrl is required in production" .Values.config.publicBaseUrl | quote }}{{ else }}{{ .Values.config.publicBaseUrl | default "" | quote }}{{ end }}
  RUNGUARD_EGRESS_PROXY_URL: {{ if .Values.config.enforceProductionGuards }}{{ required "config.egressProxyUrl is required in production" .Values.config.egressProxyUrl | quote }}{{ else }}{{ .Values.config.egressProxyUrl | default "" | quote }}{{ end }}
  HTTPS_PROXY: {{ .Values.config.egressProxyUrl | default "" | quote }}
  HTTP_PROXY: {{ .Values.config.egressProxyUrl | default "" | quote }}
  NO_PROXY: "127.0.0.1,localhost,.svc,.cluster.local,kubernetes.default.svc"
  RUNGUARD_MAX_REQUEST_BODY_BYTES: {{ .Values.config.maxRequestBodyBytes | int | quote }}
  RUNGUARD_PROTECT_DIAGNOSTICS: {{ .Values.config.protectDiagnostics | quote }}
  RUNGUARD_AUTH_MODE: {{ .Values.auth.mode | quote }}
  RUNGUARD_OIDC_ISSUER: {{ if eq .Values.auth.mode "oidc" }}{{ required "auth.oidcIssuer is required for OIDC" .Values.auth.oidcIssuer | quote }}{{ else }}""{{ end }}
  RUNGUARD_OIDC_AUDIENCE: {{ if eq .Values.auth.mode "oidc" }}{{ required "auth.oidcAudience is required for OIDC" .Values.auth.oidcAudience | quote }}{{ else }}""{{ end }}
  RUNGUARD_OIDC_JWKS_URL: {{ if eq .Values.auth.mode "oidc" }}{{ required "auth.oidcJwksUrl is required for OIDC" .Values.auth.oidcJwksUrl | quote }}{{ else }}""{{ end }}
  RUNGUARD_OIDC_ALGORITHMS: {{ .Values.auth.oidcAlgorithms | quote }}
  RUNGUARD_OIDC_ROLES_CLAIM: {{ .Values.auth.oidcRolesClaim | quote }}
  RUNGUARD_RATE_LIMIT_PER_MINUTE: {{ .Values.auth.rateLimitPerMinute | quote }}
  RUNGUARD_PREAUTH_RATE_LIMIT_PER_MINUTE: {{ .Values.auth.preauthRateLimitPerMinute | quote }}
  RUNGUARD_KUBERNETES_NAMESPACE: {{ .Release.Namespace | quote }}
  RUNGUARD_KUBERNETES_ALLOWED_NAMESPACES: {{ .Values.config.allowedNamespaces | default .Release.Namespace | quote }}
  RUNGUARD_TARGET_INVENTORY_JSON: {{ if .Values.config.enforceProductionGuards }}{{ required "config.targetInventory is required in production" .Values.config.targetInventory | toJson | quote }}{{ else }}{{ .Values.config.targetInventory | default dict | toJson | quote }}{{ end }}
  RUNGUARD_KUBERNETES_SERVICE_ACCOUNT: {{ .Values.executorServiceAccount.name | quote }}
  RUNGUARD_KUBERNETES_RUNNER_IMAGE: {{ if .Values.config.enforceProductionGuards }}{{ printf "%s@%s" .Values.runnerImage.repository (required "runnerImage.digest is required in production" .Values.runnerImage.digest) | quote }}{{ else }}{{ printf "%s:%s" .Values.runnerImage.repository .Values.runnerImage.tag | quote }}{{ end }}
