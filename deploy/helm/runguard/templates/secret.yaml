apiVersion: v1
kind: Secret
metadata:
  name: {{ include "runguard.fullname" . }}
  labels:
    {{- include "runguard.labels" . | nindent 4 }}
type: Opaque
stringData:
  RUNGUARD_DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  OPENAI_API_KEY: {{ required "secrets.openaiApiKey is required when agentBackend=langgraph" .Values.secrets.openaiApiKey | quote }}
  RUNGUARD_GITHUB_TOKEN: {{ .Values.secrets.githubToken | quote }}
  RUNGUARD_A2A_REVIEWER_TOKEN: {{ .Values.secrets.a2aReviewerToken | quote }}
