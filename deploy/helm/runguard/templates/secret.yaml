{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "runguard.fullname" . }}
  labels:
    {{- include "runguard.labels" . | nindent 4 }}
type: Opaque
stringData:
  RUNGUARD_DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  OPENAI_API_KEY: {{ required "secrets.openaiApiKey is required when agentBackend=langgraph" .Values.secrets.openaiApiKey | quote }}
  RUNGUARD_PROMETHEUS_TOKEN: {{ .Values.secrets.prometheusToken | quote }}
  RUNGUARD_LOKI_TOKEN: {{ .Values.secrets.lokiToken | quote }}
  RUNGUARD_GITHUB_TOKEN: {{ .Values.secrets.githubToken | quote }}
  RUNGUARD_MCP_PROMETHEUS_TOKEN: {{ .Values.secrets.mcpPrometheusToken | quote }}
  RUNGUARD_MCP_LOKI_TOKEN: {{ .Values.secrets.mcpLokiToken | quote }}
  RUNGUARD_MCP_KUBERNETES_TOKEN: {{ .Values.secrets.mcpKubernetesToken | quote }}
  RUNGUARD_MCP_GITHUB_TOKEN: {{ .Values.secrets.mcpGitHubToken | quote }}
  RUNGUARD_A2A_REVIEWER_TOKEN: {{ .Values.secrets.a2aReviewerToken | quote }}
  RUNGUARD_API_KEYS_JSON: {{ if eq .Values.auth.mode "api_key" }}{{ required "secrets.apiKeysJson is required for API key auth" .Values.secrets.apiKeysJson | quote }}{{ else }}"{}"{{ end }}
  RUNGUARD_PROMETHEUS_WEBHOOK_SECRET: {{ required "secrets.prometheusWebhookSecret is required" .Values.secrets.prometheusWebhookSecret | quote }}
  LANGGRAPH_AES_KEY: {{ required "secrets.langgraphAesKey is required" .Values.secrets.langgraphAesKey | quote }}
{{- end }}
